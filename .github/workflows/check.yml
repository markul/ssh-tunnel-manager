name: Build and Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Test local HTTP proxy and hostname management
        working-directory: SSHTunnelManager/LocalWebProxy
        run: swift test
      - name: Build app
        working-directory: SSHTunnelManager
        run: xcodebuild -scheme SSHTunnelManager -configuration Debug -derivedDataPath build -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build
      - name: Check model compatibility
        run: |
          swiftc SSHTunnelManager/SSHTunnelManager/Models/Tunnel.swift tests/TunnelModelChecks.swift -o /tmp/tunnel-model-checks
          /tmp/tunnel-model-checks

name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build
        run: |
          cd SSHTunnelManager
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION (build ${GITHUB_RUN_NUMBER})"
          xcodebuild -scheme SSHTunnelManager \
            -configuration Release \
            -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test local HTTP proxy
        working-directory: SSHTunnelManager/LocalWebProxy
        run: swift test -c release

      - name: Check model compatibility
        run: |
          swiftc SSHTunnelManager/SSHTunnelManager/Models/Tunnel.swift tests/TunnelModelChecks.swift -o /tmp/tunnel-model-checks
          /tmp/tunnel-model-checks

      - name: Ad-hoc sign
        run: |
          APP=SSHTunnelManager/build/Build/Products/Release/SSHTunnelManager.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose "$APP"

      - name: Create DMG
        run: |
          python3 -m venv .dmgvenv
          .dmgvenv/bin/pip install --quiet dmgbuild==1.6.7
          DMG_APP="SSHTunnelManager/build/Build/Products/Release/SSHTunnelManager.app" \
          DMG_BACKGROUND="$PWD/packaging/dmg-background.tiff" \
            .dmgvenv/bin/dmgbuild -s packaging/dmg_settings.py "SSH Tunnel Manager" SSHTunnelManager.dmg
          hdiutil verify SSHTunnelManager.dmg
          shasum -a 256 SSHTunnelManager.dmg > SSHTunnelManager.dmg.sha256

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SSHTunnelManager.dmg
            SSHTunnelManager.dmg.sha256
          body_path: packaging/release-notes.md
          # Tags like v1.9.1-rc1 become pre-releases: visible on the releases
          # page for manual testing, but ignored by the Homebrew tap sync,
          # which only follows releases/latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

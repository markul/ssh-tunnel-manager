name: Update release notes

on:
  push:
    branches: [main]
    paths:
      - packaging/release-notes.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Update the existing release description only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.request

          project = Path("SSHTunnelManager/SSHTunnelManager.xcodeproj/project.pbxproj").read_text()
          versions = set(re.findall(r"MARKETING_VERSION = ([0-9]+\.[0-9]+\.[0-9]+);", project))
          if len(versions) != 1:
              raise SystemExit("Expected one consistent app version in the Xcode project")
          tag = "v" + versions.pop()
          base = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          request = urllib.request.Request(base + "/releases/tags/" + tag, headers=headers)
          try:
              with urllib.request.urlopen(request) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print(f"No release for {tag} yet; the tag workflow will publish its notes.")
              raise SystemExit(0)

          # Updating only body preserves the release tag, metadata, and binary assets.
          body = Path("packaging/release-notes.md").read_text()
          request = urllib.request.Request(
              base + "/releases/" + str(release["id"]),
              data=json.dumps({"body": body}).encode(), headers=headers, method="PATCH",
          )
          with urllib.request.urlopen(request) as response:
              updated = json.load(response)
          assert updated["body"] == body, "Release notes did not match the requested text"
          print("Updated " + updated["html_url"])
          PY
